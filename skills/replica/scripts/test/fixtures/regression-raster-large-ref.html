<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Large raster motion reference</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 200px; margin: 0; overflow: hidden; background: #f4f1ea; }
    canvas { display: block; width: 1200px; height: 200px; }
  </style>
</head>
<body>
  <canvas width="1200" height="200"></canvas>
  <script>
    const context = document.querySelector('canvas').getContext('2d');
    const start = performance.now();
    function draw(now) {
      context.fillStyle = '#f4f1ea';
      context.fillRect(0, 0, 1200, 200);
      const progress = ((now - start) % 1000) / 1000;
      const x = 1040 + progress * 120;
      context.fillStyle = '#d1495b';
      context.beginPath();
      context.arc(x, 120, 12, 0, Math.PI * 2);
      context.fill();
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  </script>
</body>
</html>
